<!DOCTYPE html>
<html>
<head>
    <title>Add Result | Student Result System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand">🎓 Student Result System</span>
    <a href="/dashboard" class="btn btn-light btn-sm">← Back to Dashboard</a>
</nav>

<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-body p-4">
                    <h4 class="mb-4">Add Result</h4>
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label">Select Student</label>
                            <select name="student_id" class="form-select" required>
                                {% for s in students %}
                                <option value="{{ s.id }}">{{ s.name }} ({{ s.roll_no }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Select Subject</label>
                            <select name="subject_id" class="form-select" required>
                                {% for sub in subjects %}
                                <option value="{{ sub.id }}">{{ sub.name }} ({{ sub.code }})</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Marks (0 - 100)</label>
                            <input type="number" name="marks" class="form-control"
                                min="0" max="100" step="0.01" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Exam Year</label>
                            <input type="number" name="exam_year" class="form-control"
                                value="2026" required>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Add Result</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
